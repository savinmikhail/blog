services:
  app:
    image: php:8.4-cli-alpine@sha256:37c8c64177612b72e7f9d2c00481739c166a3708bea27c1cfd27fea1291d82d1
    network_mode: none
    working_dir: /work
    command: ["php", "app/config.php"]
    environment:
      DB_HOST: ${DEMO_DB_HOST:?Set DEMO_DB_HOST}
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./app:/work/app:ro
      - ./vendor:/work/vendor:ro
    secrets:
      - db_password
secrets:
  db_password:
    file: ./secrets/db-password.txt
